# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:${riskregisterhq_java_db_path:./riskregister.db}
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.driverClassName=org.sqlite.JDBC

# SQLite-specific Hikari settings (smaller pool for file-based DB)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Disable Flyway for SQLite development (MySQL DDL syntax incompatible with SQLite)
spring.flyway.enabled=false

# Session management (using JDBC with SQLite)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=180d
server.servlet.session.timeout=180d
server.servlet.session.cookie.max-age=180d
server.session.persistent=true
server.servlet.session.persistent=true

passwordless.email.from=${riskregisterhq_email_from}
spring.mail.host=${riskregisterhq_java_mail_host}
spring.mail.port=${riskregisterhq_java_mail_port:587}
spring.mail.username=${riskregisterhq_java_email_username}
spring.mail.password=${riskregisterhq_java_email_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.port=${riskregisterhq_java_mail_port:587}
spring.mail.properties.mail.debug=${riskregisterhq_java_mail_debug:false}

host.url=${riskregisterhq_java_host_url:http://localhost:8080}
server.port=${riskregisterhq_java_server_port:8080}

