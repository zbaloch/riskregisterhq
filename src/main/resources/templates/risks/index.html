<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  class="h-full bg-[#f6f2ef]">
<head>
  <div th:replace="~{fragments/head}"></div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <title>Risks – RiskRegisterHQ</title>
</head>
<body class="h-full">

  <div th:replace="~{fragments/admin-nav(activePage='risks')}"></div>
  <div class="lg:pl-72">
    <div th:replace="~{fragments/admin-nav-top}"></div>
    <main class="py-10">
      <div class="mx-auto px-4 max-w-5xl sm:px-6 lg:px-8">

        <!-- Page header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Risks <span class="text-sm text-gray-500" th:text="'(' + ${#lists.size(risks)} + ')'"></span></h1>
            <p class="mt-1 text-sm text-gray-500">Identify, assess and manage organisational risks.</p>
          </div>
          <a href="/risks/new"
            class="inline-flex items-center gap-2 rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-sky-500 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            New Risk
          </a>
        </div>

        <!-- Flash messages -->
        <div th:if="${success}" class="mb-4 rounded-lg bg-green-50 border border-green-200 p-4 flex gap-3 items-start">
          <svg class="w-5 h-5 text-green-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <p class="text-sm font-medium text-green-800" th:text="${success}"></p>
        </div>
        <div th:if="${error}" class="mb-4 rounded-lg bg-red-50 border border-red-200 p-4">
          <p class="text-sm font-medium text-red-800" th:text="${error}"></p>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(risks)}"
          class="bg-white rounded-xl border border-gray-200 shadow-sm p-16 text-center">
          <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
          </svg>
          <h3 class="mt-4 text-sm font-semibold text-gray-900">No risks recorded</h3>
          <p class="mt-1 text-sm text-gray-500">Get started by creating your first risk.</p>
          <a href="/risks/new"
            class="mt-6 inline-flex items-center gap-2 rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-500 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            New Risk
          </a>
        </div>

        <!-- Risk table -->
        <div th:if="${not #lists.isEmpty(risks)}"
          class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Risk</th>
                <!-- <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Risk Title</th> -->
                <!-- <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Category</th>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Subcategory</th>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Dimension</th> -->
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Inherent Risk</th>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Residual Risk</th>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Treatment</th>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Owner</th>
                <!-- <th class="px-5 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th> -->
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 bg-white">
              <tr th:each="risk : ${risks}" class="hover:bg-gray-50 transition-colors">

                <!-- Risk ID -->
                <td class="px-5 py-4 whitespace-nowrap">
                  <a th:href="@{/risks/{id}(id=${risk.id})}" class="text-sm font-medium text-sky-600 hover:text-sky-700 hover:underline"
                    th:text="${risk.riskId} + ' ' + ${risk.title}"></a>
                  <div th:text="${risk.riskCategoryId != null ? categoryMap[risk.riskCategoryId] ?: '—' : '—'}" class="text-sm text-gray-700"></div>
                  <div th:text="${risk.riskSubcategoryId != null ? subcategoryMap[risk.riskSubcategoryId] ?: '—' : '—'}" class="text-sm text-gray-700"></div>
                  <div th:text="${risk.riskDimensionId != null ? dimensionMap[risk.riskDimensionId] ?: '—' : '—'}" class="text-sm text-gray-700"></div>
                </td>

                <!-- Title -->
                <!-- <td class="px-5 py-4 max-w-xs">
                  <a th:href="@{/risks/{id}(id=${risk.id})}"
                    class="text-sm font-medium text-gray-900 hover:text-sky-600 line-clamp-2"
                    th:text="${risk.title ?: '—'}"></a>
                </td> -->

                <!-- Category -->
                <!-- <td class="px-5 py-4 whitespace-nowrap">
                  <span th:text="${categoryMap[risk.riskCategoryId] ?: '—'}" class="text-sm text-gray-700"></span>
                </td> -->

                <!-- Subcategory -->
                <!-- <td class="px-5 py-4 whitespace-nowrap">
                  <span th:text="${subcategoryMap[risk.riskSubcategoryId] ?: '—'}" class="text-sm text-gray-700"></span>
                </td> -->

                <!-- Dimension -->
                <!-- <td class="px-5 py-4 whitespace-nowrap">
                  <span th:text="${dimensionMap[risk.riskDimensionId] ?: '—'}" class="text-sm text-gray-700"></span>
                </td> -->

                <!-- Inherent Risk Score -->
                <td class="px-5 py-4 whitespace-nowrap">
                  <div th:if="${risk.inherentScore != null}" class="flex items-center gap-1.5">
                    <span class="text-sm font-bold"
                      th:text="${risk.inherentScore}"
                      th:classappend="${risk.inherentScoreLevel == 'Very Low'} ? 'text-green-600' :
                                      (${risk.inherentScoreLevel == 'Low'} ? 'text-yellow-600' :
                                      (${risk.inherentScoreLevel == 'Medium'} ? 'text-orange-600' :
                                      (${risk.inherentScoreLevel == 'High'} ? 'text-rose-600' : 'text-red-600')))">
                    </span>
                    <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium"
                      th:text="${risk.inherentScoreLevel}"
                      th:classappend="${risk.inherentScoreLevel == 'Very Low'} ? 'bg-green-50 text-green-600' :
                                      (${risk.inherentScoreLevel == 'Low'} ? 'bg-yellow-50 text-yellow-600' :
                                      (${risk.inherentScoreLevel == 'Medium'} ? 'bg-orange-50 text-orange-600' :
                                      (${risk.inherentScoreLevel == 'High'} ? 'bg-rose-50 text-rose-600' : 'bg-red-50 text-red-600')))">
                    </span>
                  </div>
                  <span th:unless="${risk.inherentScore != null}" class="text-sm text-gray-400">—</span>
                </td>

                <!-- Residual Risk Score -->
                <td class="px-5 py-4 whitespace-nowrap">
                  <div th:if="${risk.residualScore != null}" class="flex items-center gap-1.5">
                    <span class="text-sm font-bold"
                      th:text="${risk.residualScore}"
                      th:classappend="${risk.residualScoreLevel == 'Very Low'} ? 'text-green-600' :
                                      (${risk.residualScoreLevel == 'Low'} ? 'text-yellow-600' :
                                      (${risk.residualScoreLevel == 'Medium'} ? 'text-orange-600' :
                                      (${risk.residualScoreLevel == 'High'} ? 'text-rose-600' : 'text-red-600')))">
                    </span>
                    <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium"
                      th:text="${risk.residualScoreLevel}"
                      th:classappend="${risk.residualScoreLevel == 'Very Low'} ? 'bg-green-50 text-green-600' :
                                      (${risk.residualScoreLevel == 'Low'} ? 'bg-yellow-50 text-yellow-600' :
                                      (${risk.residualScoreLevel == 'Medium'} ? 'bg-orange-50 text-orange-600' :
                                      (${risk.residualScoreLevel == 'High'} ? 'bg-rose-50 text-rose-600' : 'bg-red-50 text-red-600')))">
                    </span>
                  </div>
                  <span th:unless="${risk.residualScore != null}" class="text-sm text-gray-400">—</span>
                </td>

                <!-- Treatment -->
                <td class="px-5 py-4 whitespace-nowrap">
                  <span th:if="${risk.riskTreatment != null}" class="text-sm text-gray-700">
                    <th:block th:with="formatted=${#strings.replace(risk.riskTreatment.name(), '_', ' ')}">
                      <span th:text="${#strings.capitalize(#strings.toLowerCase(formatted))}"></span>
                    </th:block>
                  </span>
                  <span th:unless="${risk.riskTreatment != null}" class="text-sm text-gray-400">—</span>
                </td>


                <!-- Status -->
                <td class="px-5 py-4 whitespace-nowrap">
                  <span th:if="${risk.statusId != null}"
                        class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium capitalize bg-gray-50 text-gray-700 border border-gray-100"
                        th:text="${statusMap[risk.statusId]}"></span>
                  <span th:unless="${risk.statusId != null}" class="text-sm text-gray-400">—</span>
                </td>

                <!-- Owner -->
                <td class="px-5 py-4 whitespace-nowrap">
                  <span class="text-sm text-gray-700" th:text="${risk.riskOwnerName ?: '—'}"></span>
                </td>

                <!-- Actions -->
                <!-- <td class="px-5 py-4 whitespace-nowrap text-right">
                  <div class="flex items-center justify-end gap-1">
                    <a th:href="@{/risks/{id}(id=${risk.id})}"
                      class="rounded-md px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-colors">
                      View
                    </a>
                    <a th:href="@{/risks/{id}/edit(id=${risk.id})}"
                      class="rounded-md px-2.5 py-1.5 text-xs font-medium text-sky-600 hover:text-sky-900 hover:bg-sky-50 transition-colors">
                      Edit
                    </a>
                    <form th:action="@{/risks/{id}/delete(id=${risk.id})}" method="post"
                      x-data
                      @submit.prevent="if(confirm('Delete this risk? This action marks it as deleted.')) $el.submit()">
                      <button type="submit"
                        class="rounded-md px-2.5 py-1.5 text-xs font-medium text-red-500 hover:text-red-700 hover:bg-red-50 transition-colors">
                        Delete
                      </button>
                    </form>
                  </div>
                </td> -->
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>
</body>
</html>
