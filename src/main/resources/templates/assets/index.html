<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-[#f6f2ef]">

<head>
  <div th:replace="~{fragments/head}"></div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <title>Assets – RiskRegisterHQ</title>
</head>

<body class="h-full">

  <div th:replace="~{fragments/admin-nav(activePage='assets')}"></div>
  <div class="lg:pl-72">
    <div th:replace="~{fragments/admin-nav-top}"></div>
    <main class="py-10">
      <div class="mx-auto px-4 max-w-7xl sm:px-6 lg:px-8">

        <!-- Breadcrumb -->
        <!-- <div class="mb-6 flex items-center gap-2 text-sm">
          <a href="/" class="text-sky-600 hover:text-sky-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Dashboard
          </a>
          <span class="text-gray-400">/</span>
          <span class="text-gray-700">Assets</span>
        </div> -->

        <!-- Page header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Assets <span class="text-sm text-gray-500" th:text="'(' + ${#lists.size(assets)} + ')'"></span></h1>
            <p class="mt-1 text-sm text-gray-500">Manage valuable resources your organisation needs to protect.</p>
          </div>
          <a href="/assets/new"
            class="inline-flex items-center gap-2 rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-sky-500 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Asset
          </a>
        </div>

        <!-- Info banner -->
        <!-- <div class="mb-6 rounded-lg bg-blue-50 border border-blue-200 p-4">
          <p class="text-sm text-blue-800">
            Assets are the valuable resources your organisation needs to protect. Track what you have, who owns it, and how critical it is to your operations.
          </p>
        </div> -->

        <!-- Flash messages -->
        <div th:if="${success}" class="mb-4 rounded-lg bg-green-50 border border-green-200 p-4 flex gap-3 items-start">
          <svg class="w-5 h-5 text-green-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <p class="text-sm font-medium text-green-800" th:text="${success}"></p>
        </div>
        <div th:if="${error}" class="mb-4 rounded-lg bg-red-50 border border-red-200 p-4">
          <p class="text-sm font-medium text-red-800" th:text="${error}"></p>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(assets)}"
          class="bg-white rounded-xl border border-gray-200 shadow-sm p-16 text-center">
          <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
          </svg>
          <h3 class="mt-4 text-sm font-semibold text-gray-900">No assets yet</h3>
          <p class="mt-1 text-sm text-gray-500">Start by creating your first asset.</p>
          <a href="/assets/new"
            class="mt-6 inline-flex items-center gap-2 rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-500 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Asset
          </a>
        </div>

        <!-- Assets table -->
        <div th:if="${not #lists.isEmpty(assets)}"
          class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Type</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">CIA Rating</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Owner</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 bg-white">
              <tr th:each="asset : ${assets}" class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4">
                  <a th:href="@{/assets/{id}(id=${asset.id})}"
                    class="text-sm font-medium text-sky-600 hover:text-sky-700 hover:underline"
                    th:text="${asset.name}"></a>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <span class="text-sm text-gray-900" th:text="${asset.type != null and typeMap[asset.type] != null} ? ${typeMap[asset.type].name} : (${asset.type} ?: '—')"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <span th:if="${asset.status == 'Active'}" class="inline-flex items-center rounded-full bg-green-50 px-2.5 py-0.5 text-xs font-medium text-green-700">Active</span>
                  <span th:if="${asset.status == 'Retired'}" class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-medium text-red-700">Retired</span>
                  <span th:if="${asset.status == 'Archived'}" class="inline-flex items-center rounded-full bg-gray-50 px-2.5 py-0.5 text-xs font-medium text-gray-700">Archived</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <div class="flex gap-1.5">
                    <!-- Confidentiality -->
                    <span th:classappend="${asset.confidentiality <= 2 ? 'bg-green-50 text-green-700 border-green-100' : asset.confidentiality == 3 ? 'bg-yellow-50 text-yellow-700 border-yellow-100' : 'bg-red-50 text-red-700 border-red-100'}"
                          th:title="'Confidentiality: ' + ${asset.confidentiality}"
                          class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium border cursor-default">
                      C:<span th:text="${asset.confidentiality}"></span>
                    </span>
                    <!-- Integrity -->
                    <span th:classappend="${asset.integrity <= 2 ? 'bg-green-50 text-green-700 border-green-100' : asset.integrity == 3 ? 'bg-yellow-50 text-yellow-700 border-yellow-100' : 'bg-red-50 text-red-700 border-red-100'}"
                          th:title="'Integrity: ' + ${asset.integrity}"
                          class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium border cursor-default">
                      I:<span th:text="${asset.integrity}"></span>
                    </span>
                    <!-- Availability -->
                    <span th:classappend="${asset.availability <= 2 ? 'bg-green-50 text-green-700 border-green-100' : asset.availability == 3 ? 'bg-yellow-50 text-yellow-700 border-yellow-100' : 'bg-red-50 text-red-700 border-red-100'}"
                          th:title="'Availability: ' + ${asset.availability}"
                          class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium border cursor-default">
                      A:<span th:text="${asset.availability}"></span>
                    </span>
                  </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                  <span th:text="${asset.ownerName != null and asset.ownerName != '' ? @nameUtils.shortName(asset.ownerName) : '—'}"></span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

</body>

</html>
