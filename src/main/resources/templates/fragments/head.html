<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Inter', sans-serif;
  }
  [x-cloak] {
    display: none !important;
  }
</style>

<script type="module" src="https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/js/avatar-utils.js"></script>
<script src="/js/color-utils.js"></script>
<script type="module" src="/js/lexical-editor.js"></script>

<style>
  /* Lexical Editor Styles */
  .lexical-editor {
    /* border: 1px solid #d1d5db; */
    border-radius: 0.5rem;
    padding: 0.875rem;
    min-height: 120px;
    font-size: 0.875rem;
    color: #111827;
    background: white;
  }

  .lexical-editor:focus {
    outline: none;
  }

  .lexical-toolbar {
    display: flex;
    gap: 0.25rem;
    align-items: center;
    padding: 0.625rem;
    background: #f9fafb;
    margin-bottom: 0.75rem;
    border-radius: 0.375rem;
    flex-wrap: wrap;
  }

  .lexical-toolbar .toolbar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    cursor: pointer;
    color: #374151;
    transition: all 0.15s ease;
  }

  .lexical-toolbar .toolbar-btn:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .lexical-toolbar .toolbar-btn:active {
    background: #e5e7eb;
    border-color: #6b7280;
  }

  .lexical-toolbar .toolbar-btn.active {
    background: #0ea5e9;
    color: white;
    border-color: #0ea5e9;
  }

  .lexical-toolbar .toolbar-btn svg {
    width: 18px;
    height: 18px;
    stroke-width: 2;
  }

  .toolbar-divider {
    width: 1px;
    height: 20px;
    background: #d1d5db;
    margin: 0 0.25rem;
  }

  .lexical-toolbar button {
    padding: 0.375rem 0.75rem;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 0.75rem;
    color: #374151;
    transition: all 0.2s;
  }

  .lexical-toolbar button:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
  }

  .lexical-toolbar button.active {
    background: #0ea5e9;
    color: white;
    border-color: #0ea5e9;
  }

  .editor-container {
    border: 1px solid #d1d5db;
    border-radius: 0.5rem;
    overflow: hidden;
  }

  .lexical-content {
    padding-top: 0.875rem;
    padding-bottom: 0.875rem;
  }

  .lexical-content p {
    margin: 0 0 0.5rem 0;
  }

  .lexical-content strong {
    font-weight: 600;
  }

  .lexical-content em {
    font-style: italic;
  }

  .lexical-content ul, .lexical-content ol {
    margin: 0.5rem 0 0.5rem 1.5rem;
  }

  .lexical-content li {
    margin: 0.25rem 0;
  }
</style>
