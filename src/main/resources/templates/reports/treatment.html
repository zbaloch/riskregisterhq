<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  class="h-full bg-[#f6f2ef]">

<head>
  <div th:replace="~{fragments/head}"></div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <title>Treatment Decisions - RiskRegisterHQ</title>
</head>

<body class="h-full">

  <div th:replace="~{fragments/admin-nav(activePage='reports')}"></div>

  <div class="lg:pl-72">
    <div th:replace="~{fragments/admin-nav-top}"></div>

    <main class="py-10">
      <div class="mx-auto px-4 max-w-7xl sm:px-6 lg:px-8">

        <div th:replace="~{fragments/report-shell :: header(${reportTitle}, ${reportSubtitle})}"></div>

        <!-- Summary tiles -->
        <div class="mt-8 grid grid-cols-2 lg:grid-cols-5 gap-4">
          <div th:each="row : ${rows}" class="bg-white rounded-xl border border-gray-200 shadow-sm p-5"
            th:classappend="${row.backlog and row.count() > 0} ? 'ring-1 ring-amber-300' : ''">
            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium" th:classappend="${row.badgeClass}" th:text="${row.label}"></span>
            <p class="mt-3 text-3xl font-bold text-gray-900" th:text="${row.count()}"></p>
          </div>
        </div>

        <!-- Per-treatment risk lists -->
        <div class="mt-6 space-y-6">
          <div th:each="row : ${rows}" th:if="${row.count() > 0}"
            class="bg-white rounded-xl border shadow-sm overflow-hidden"
            th:classappend="${row.backlog} ? 'border-amber-300' : 'border-gray-200'">

            <div class="px-6 py-4 border-b flex items-center justify-between gap-3"
              th:classappend="${row.backlog} ? 'border-amber-200 bg-amber-50' : 'border-gray-200'">
              <div>
                <h2 class="text-base font-semibold text-gray-900" th:text="${row.label}"></h2>
                <p th:if="${row.backlog}" class="text-xs text-amber-800 mt-0.5">
                  These risks have no treatment decision yet. The age column shows how long each has been waiting.
                </p>
              </div>
              <span class="text-sm font-semibold text-gray-600 shrink-0" th:text="${row.count()} + (${row.count()} == 1 ? ' risk' : ' risks')"></span>
            </div>

            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Risk</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Owner</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Inherent</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Residual</th>
                    <th th:if="${row.backlog}" class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Waiting</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                  <tr th:each="r : ${row.risks}" class="hover:bg-gray-50">
                    <td class="px-6 py-3.5 text-sm">
                      <a th:href="@{'/risks/' + ${r.id}}" class="font-medium text-sky-600 hover:text-sky-800" th:text="${r.riskId}"></a>
                      <span class="text-gray-700" th:text="' — ' + ${r.title}"></span>
                    </td>
                    <td class="px-6 py-3.5 text-sm text-gray-600" th:text="${r.riskOwnerName} ?: '—'"></td>
                    <td class="px-6 py-3.5 text-center">
                      <span th:replace="~{fragments/report-shell :: score(${r.inherentScore})}"></span>
                      <span th:if="${r.inherentScore == null}" class="text-xs text-gray-400">—</span>
                    </td>
                    <td class="px-6 py-3.5 text-center">
                      <span th:replace="~{fragments/report-shell :: score(${r.residualScore})}"></span>
                      <span th:if="${r.residualScore == null}" class="text-xs text-gray-400">—</span>
                    </td>
                    <td th:if="${row.backlog}" class="px-6 py-3.5 text-sm text-right"
                      th:with="age=${reportService.daysSinceCreated(r)}"
                      th:classappend="${age > 30} ? 'text-red-700 font-semibold' : 'text-gray-600'"
                      th:text="${age} + (${age} == 1 ? ' day' : ' days')"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
