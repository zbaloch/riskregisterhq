<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  class="h-full bg-[#f6f2ef]">

<head>
  <div th:replace="~{fragments/head}"></div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <title>Change Report - RiskRegisterHQ</title>
</head>

<body class="h-full">

  <div th:replace="~{fragments/admin-nav(activePage='reports')}"></div>

  <div class="lg:pl-72">
    <div th:replace="~{fragments/admin-nav-top}"></div>

    <main class="py-10">
      <div class="mx-auto px-4 max-w-7xl sm:px-6 lg:px-8">

        <div th:replace="~{fragments/report-shell :: header(${reportTitle}, ${reportSubtitle})}"></div>

        <!-- Period picker -->
        <form method="GET" action="/reports/changes" class="mt-6 bg-white rounded-xl border border-gray-200 shadow-sm p-5 flex flex-wrap items-end gap-4 print:hidden">
          <div>
            <label for="from" class="block text-sm font-medium text-gray-700 mb-1">From</label>
            <input type="date" id="from" name="from" th:value="${from}"
              class="rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-colors">
          </div>
          <div>
            <label for="to" class="block text-sm font-medium text-gray-700 mb-1">To</label>
            <input type="date" id="to" name="to" th:value="${to}"
              class="rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-colors">
          </div>
          <button type="submit" class="rounded-md bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-500 transition-colors">
            Apply
          </button>
        </form>

        <!-- Period summary -->
        <div class="mt-6 grid grid-cols-2 lg:grid-cols-5 gap-4">
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Risks Created</p>
            <p class="mt-2 text-3xl font-bold text-gray-900" th:text="${report.risksCreated}"></p>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Risks Updated</p>
            <p class="mt-2 text-3xl font-bold text-gray-900" th:text="${report.risksUpdated}"></p>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Score Changes</p>
            <p class="mt-2 text-3xl font-bold text-sky-700" th:text="${report.scoreChanges}"></p>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Risks Removed</p>
            <p class="mt-2 text-3xl font-bold text-gray-900" th:text="${report.risksDeleted}"></p>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Taxonomy Edits</p>
            <p class="mt-2 text-3xl font-bold text-gray-900" th:text="${report.taxonomyChanges}"></p>
          </div>
        </div>

        <div th:if="${report.empty}" class="mt-6">
          <div th:replace="~{fragments/report-shell :: empty('No changes in this period', 'Nothing was recorded between the selected dates. Try widening the range.')}"></div>
        </div>

        <!-- Change log -->
        <div th:unless="${report.empty}" class="mt-6 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-base font-semibold text-gray-900">Change Log</h2>
            <p class="text-sm text-gray-500 mt-0.5">
              <span th:text="${#lists.size(report.entries)}"></span> entries from
              <span th:text="${#temporals.format(from, 'dd MMM yyyy')}"></span> to
              <span th:text="${#temporals.format(to, 'dd MMM yyyy')}"></span>
            </p>
          </div>

          <ul class="divide-y divide-gray-200">
            <li th:each="e : ${report.entries}" class="px-6 py-4">
              <div class="flex items-start gap-3">

                <!-- Action icon -->
                <span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full"
                  th:classappend="${e.entry.action == 'CREATED'} ? 'bg-green-100 text-green-700'
                                : (${e.entry.action == 'DELETED'} ? 'bg-red-100 text-red-700'
                                : (${e.entry.action == 'REVIEWED'} ? 'bg-purple-100 text-purple-700' : 'bg-sky-100 text-sky-700'))">
                  <svg th:if="${e.entry.action == 'CREATED'}" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                  </svg>
                  <svg th:if="${e.entry.action == 'DELETED'}" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                  <svg th:if="${e.entry.action == 'REVIEWED'}" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <svg th:if="${e.entry.action == 'UPDATED'}" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                </span>

                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-baseline gap-x-2">
                    <span class="inline-flex items-center rounded-full bg-gray-100 px-2 py-0.5 text-[0.625rem] font-medium text-gray-600" th:text="${e.entityLabel}"></span>
                    <a th:if="${e.riskId != null}" th:href="@{'/risks/' + ${e.entry.entityId}}"
                      class="text-sm font-medium text-sky-600 hover:text-sky-800" th:text="${e.riskId}"></a>
                    <span class="text-sm text-gray-800" th:text="${e.entry.summary}"></span>
                  </div>

                  <p class="mt-1 text-xs text-gray-500">
                    <span th:text="${e.entry.actorName} ?: ${e.entry.actorEmail}"></span>
                    · <span th:text="${e.entry.createdAtFormatted}"></span>
                  </p>

                  <!-- Field-level before/after -->
                  <div th:if="${e.hasChanges()}" class="mt-2 rounded-lg bg-gray-50 border border-gray-200 divide-y divide-gray-200">
                    <div th:each="c : ${e.changes}" class="px-3 py-2 text-xs">
                      <span class="font-medium text-gray-700" th:text="${c.label}"></span>
                      <div class="mt-0.5 flex flex-wrap items-center gap-1.5">
                        <span class="rounded bg-red-50 px-1.5 py-0.5 text-red-700 line-through decoration-red-300"
                          th:text="${#strings.isEmpty(c.oldValue)} ? '(empty)' : ${#strings.abbreviate(c.oldValue, 80)}"></span>
                        <svg class="w-3 h-3 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                        <span class="rounded bg-green-50 px-1.5 py-0.5 text-green-800"
                          th:text="${#strings.isEmpty(c.newValue)} ? '(empty)' : ${#strings.abbreviate(c.newValue, 80)}"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
