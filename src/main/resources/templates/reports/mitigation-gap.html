<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  class="h-full bg-[#f6f2ef]">

<head>
  <div th:replace="~{fragments/head}"></div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <title>Mitigation Gaps - RiskRegisterHQ</title>
</head>

<body class="h-full">

  <div th:replace="~{fragments/admin-nav(activePage='reports')}"></div>

  <div class="lg:pl-72">
    <div th:replace="~{fragments/admin-nav-top}"></div>

    <main class="py-10">
      <div class="mx-auto px-4 max-w-7xl sm:px-6 lg:px-8">

        <div th:replace="~{fragments/report-shell :: header(${reportTitle}, ${reportSubtitle})}"></div>

        <div th:if="${#lists.isEmpty(rows)}" class="mt-8">
          <div th:replace="~{fragments/report-shell :: empty('No mitigation gaps', 'Every risk marked for mitigation has active tasks behind it and none are wholly overdue.')}"></div>
        </div>

        <div th:unless="${#lists.isEmpty(rows)}">

          <div class="mt-8 grid grid-cols-2 gap-4 max-w-md">
            <div class="bg-white rounded-xl border border-red-200 shadow-sm p-5">
              <p class="text-xs font-semibold text-red-600 uppercase tracking-wider">Critical</p>
              <p class="mt-2 text-3xl font-bold text-red-700"
                th:text="${#lists.size(rows.?[critical])}"></p>
              <p class="mt-1 text-xs text-gray-500">no tasks, or all work overdue</p>
            </div>
            <div class="bg-white rounded-xl border border-amber-200 shadow-sm p-5">
              <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Warning</p>
              <p class="mt-2 text-3xl font-bold text-amber-700"
                th:text="${#lists.size(rows) - #lists.size(rows.?[critical])}"></p>
              <p class="mt-1 text-xs text-gray-500">partially slipping</p>
            </div>
          </div>

          <div class="mt-6 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Risk</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Category</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Owner</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Residual</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Tasks</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Gap</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                  <tr th:each="row : ${rows}" class="hover:bg-gray-50"
                    th:classappend="${row.critical} ? 'bg-red-50/40' : ''">
                    <td class="px-6 py-3.5 text-sm">
                      <a th:href="@{'/risks/' + ${row.risk.id}}" class="font-medium text-sky-600 hover:text-sky-800" th:text="${row.risk.riskId}"></a>
                      <p class="text-gray-700 mt-0.5" th:text="${row.risk.title}"></p>
                    </td>
                    <td class="px-6 py-3.5 text-sm text-gray-600" th:text="${row.categoryName}"></td>
                    <td class="px-6 py-3.5 text-sm text-gray-600" th:text="${row.risk.riskOwnerName} ?: '—'"></td>
                    <td class="px-6 py-3.5 text-center">
                      <span th:replace="~{fragments/report-shell :: score(${row.risk.residualScore})}"></span>
                      <span th:if="${row.risk.residualScore == null}" class="text-xs text-gray-400">—</span>
                    </td>
                    <td class="px-6 py-3.5 text-center text-sm text-gray-600 whitespace-nowrap">
                      <span th:text="${row.openTasks} + ' open'"></span>
                      <span th:if="${row.overdueTasks > 0}" class="text-red-600 font-medium" th:text="' · ' + ${row.overdueTasks} + ' overdue'"></span>
                      <span th:if="${row.totalTasks == 0}" class="text-gray-400">none</span>
                    </td>
                    <td class="px-6 py-3.5 text-sm">
                      <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
                        th:classappend="${row.critical} ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'"
                        th:text="${row.gap}"></span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="border-t border-gray-200 bg-gray-50 px-6 py-3">
              <p class="text-xs text-gray-500">
                Covers open risks whose treatment is <strong>Mitigate</strong>. Closed risks are excluded — they need no active mitigation.
              </p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
